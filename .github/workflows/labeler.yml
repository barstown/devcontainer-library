---
name: Pull Request Labeler
on:
  pull_request_target:
    types:
      - assigned
      - edited
      - labeled
      - opened
      - reopened
      - synchronize
      - unlabeled

jobs:
  labeler:
    runs-on: ubuntu-latest
    if: github.repository == 'barstown/devcontainer-library'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add labels to pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
